services:
  backend:
    image: localseva_backend:1.1
    container_name: localseva_backend
    env_file: .env.docker
    ports:
      - "8000:8000"
    networks:
      - localseva-net
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: localseva_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # ports:
    #   - :5432
    networks:
      - localseva-net
    volumes:
      - localseva_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.10
    container_name: localseva_redis
    # ports:
    #   - :6379
    networks:
      - localseva-net


volumes:
  localseva_postgres_data:
    external: true

networks:
  localseva-net:
    external: true

