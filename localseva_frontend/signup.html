<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalSeva - Sign Up</title>
    <!-- Modern Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Design System -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--primary-light), var(--bg));
        padding: var(--space-4);
      }
      
      .auth-card {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-xl);
        overflow: hidden;
      }
      
      .auth-header {
        text-align: center;
        padding: var(--space-6) var(--space-6) var(--space-4);
      }
      
      .auth-logo {
        font-size: var(--font-size-2xl);
        font-weight: 800;
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        margin-bottom: var(--space-2);
        text-decoration: none;
      }
      
      .auth-subtitle {
        color: var(--text-secondary);
        font-size: var(--font-size-sm);
      }
      
      .auth-body {
        padding: 0 var(--space-6) var(--space-6);
      }
      
      .auth-footer {
        text-align: center;
        padding: var(--space-4);
        background: var(--bg-alt);
        border-top: 1px solid var(--border);
        font-size: var(--font-size-sm);
      }
      
      .checkbox-group {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
      }
      
      .checkbox-group input {
        margin-top: 4px;
        cursor: pointer;
      }
      
      .checkbox-group label {
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    
    <div class="auth-card animate-fade-in">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <i class="fas fa-hands-helping"></i> LocalSeva
        </a>
        <p class="auth-subtitle">Create your account to get started.</p>
      </div>
      
      <div class="auth-body">
        <form id="signupForm">
          <div class="form-group">
            <label class="form-label required" for="username">Username</label>
            <div style="position: relative;">
              <i class="fas fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
              <input type="text" id="username" class="form-control" style="padding-left: 2.5rem;" placeholder="Choose a username" required />
            </div>
            <small class="form-text">This will be your public display name.</small>
          </div>
          
          <div class="form-group">
            <label class="form-label required" for="email">Email Address</label>
            <div style="position: relative;">
              <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
              <input type="email" id="email" class="form-control" style="padding-left: 2.5rem;" placeholder="your@email.com" required />
            </div>
          </div>
          
          <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label required" for="password">Password</label>
              <div style="position: relative;">
                <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                <input type="password" id="password" class="form-control" style="padding-left: 2.5rem;" placeholder="••••••••" required />
              </div>
            </div>
            
            <div class="form-group">
              <label class="form-label required" for="confirmPassword">Confirm</label>
              <div style="position: relative;">
                <i class="fas fa-check-circle" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                <input type="password" id="confirmPassword" class="form-control" style="padding-left: 2.5rem;" placeholder="••••••••" required />
              </div>
            </div>
          </div>
          
          <div class="checkbox-group">
            <input type="checkbox" id="terms" required />
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
            Create Account <i class="fas fa-user-plus ml-2"></i>
          </button>
        </form>
      </div>
      
      <div class="auth-footer">
        Already have an account? <a href="index.html">Log in here</a>
      </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
